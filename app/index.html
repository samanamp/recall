<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      CSP: scripts only from this origin ('wasm-unsafe-eval' lets the FSRS
      optimizer and the .apkg importer compile their WebAssembly); inline
      styles are allowed for KaTeX and React style props; images may be
      synced blobs, data URIs or https; the API may live on any https origin
      (or a local wrangler dev server). Vite dev works under it unchanged.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self' data:; connect-src 'self' https: http://localhost:*; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f4f7" />
    <link rel="preconnect" href="https://recall-api.info-d80.workers.dev" crossorigin />
    <title>recall</title>
    <!-- pre-paint desk colour (matches --desk in index.css) -->
    <style>
      html { background-color: #f2f4f7; }
      html.dark { background-color: #101318; }
    </style>
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
